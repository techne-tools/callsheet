<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Callsheet mark: a quiet stack of three colour-coded cards on paper.
       Colour is the grammar — slate (research), sage (making), ochre (teaching).
       All cards fan down-right so the stack reads at 32px. -->
  <rect width="1024" height="1024" rx="224" fill="#F7F7F7"/>
  <!-- back card: slate -->
  <rect x="232" y="232" width="480" height="480" rx="56" fill="#A8B4C4"/>
  <!-- middle card: sage -->
  <rect x="272" y="272" width="480" height="480" rx="56" fill="#A9C4A8"/>
  <!-- front card: ochre -->
  <rect x="312" y="312" width="480" height="480" rx="56" fill="#D9B98A"/>
  <!-- quiet lines on the front card: the day's content, receding -->
  <rect x="392" y="440" width="320" height="28" rx="14" fill="#F7F7F7" opacity="0.55"/>
  <rect x="392" y="512" width="240" height="28" rx="14" fill="#F7F7F7" opacity="0.4"/>
  <rect x="392" y="584" width="280" height="28" rx="14" fill="#F7F7F7" opacity="0.4"/>
</svg>
