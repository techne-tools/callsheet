# Dependabot auto-merge for patch + minor bumps.
#
# Differs from the unslop original in one way: `gh pr merge --auto` merges
# IMMEDIATELY when the base branch has no required status checks, and this
# estate protects no branches — a red build would land. `gh pr checks --watch`
# waits for the PR's checks and exits non-zero if any fail, so the merge only
# happens on green. With no checks at all it exits non-zero too, so we never
# merge blind.
name: Dependabot Auto-Merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge patch + minor updates once CI is green
        if: contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.metadata.outputs.update-type)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if gh pr checks "$PR_URL" --watch --fail-fast; then
            gh pr merge --squash --delete-branch "$PR_URL"
          else
            gh pr comment "$PR_URL" --body \
              "Auto-merge held: CI is not green on this head. Review before merging."
          fi

      - name: Comment on major updates (manual review required)
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_URL" --body \
            "Major version bump — auto-merge skipped. Review the changelog before merging."
