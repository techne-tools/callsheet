name: Publish to itch.io

# Fires when the draft release created by release.yml is published.
# Flow: push tag -> release.yml builds 4 platforms -> draft release ->
#       you publish it -> this workflow pushes the builds to itch.io.
#
# workflow_dispatch exists so the pusher can be re-run and verified without
# cutting a new release. It needs a tag to push: set `tag` to an existing
# release tag (e.g. v0.4.2). Note the `release` event checks out the TAG's
# tree, not main, so workflow files must be present in the tag itself for a
# release-triggered run to use the latest version of this script.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose assets should be pushed (e.g. v0.4.2)'
        required: true
        type: string

jobs:
  publish:
    name: Push builds to itch.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The tag is only ever used to address a release, never to check out or
      # build from, so it must not reach `ref:`. Validate the shape first and
      # pass it to the download step through the environment (not string
      # interpolation) so it cannot inject shell arguments either.
      - name: Resolve and validate tag
        id: tag
        env:
          REQUESTED: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if ! printf '%s' "$REQUESTED" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.]+)?$'; then
            echo "::error::Refusing to use unexpected tag name: $REQUESTED"
            exit 1
          fi
          echo "name=$REQUESTED" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        run: gh release download "$TAG" --dir assets --pattern '*' --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}

      - name: Organize assets by platform
        run: |
          mkdir -p push/osx-arm64 push/osx-x86_64 push/linux push/windows
          # macOS (Apple Silicon)
          cp assets/*aarch64*.dmg push/osx-arm64/ 2>/dev/null || true
          cp assets/*arm64*.dmg push/osx-arm64/ 2>/dev/null || true
          # macOS (Intel)
          cp assets/*x86_64*.dmg push/osx-x86_64/ 2>/dev/null || true
          cp assets/*x64*.dmg push/osx-x86_64/ 2>/dev/null || true
          # Linux
          cp assets/*.deb assets/*.AppImage assets/*.rpm push/linux/ 2>/dev/null || true
          # Windows
          cp assets/*.msi assets/*.exe push/windows/ 2>/dev/null || true
          echo "--- osx-arm64:"; ls push/osx-arm64/ 2>/dev/null
          echo "--- osx-x86_64:"; ls push/osx-x86_64/ 2>/dev/null
          echo "--- linux:"; ls push/linux/ 2>/dev/null
          echo "--- windows:"; ls push/windows/ 2>/dev/null

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler-bin
          chmod +x butler-bin/butler
          echo "$(pwd)/butler-bin" >> "$GITHUB_PATH"
          # GITHUB_PATH only takes effect from the NEXT step onward, so the
          # current step needs the directory on its own PATH to verify butler.
          export PATH="$(pwd)/butler-bin:$PATH"
          butler version

      - name: Push macOS (Apple Silicon)
        if: hashFiles('push/osx-arm64/*') != ''
        run: butler push --if-changed --userversion "$USERVERSION" push/osx-arm64 prismatic7/callsheet:osx-arm64
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          USERVERSION: ${{ github.event.release.tag_name }}

      - name: Push macOS (Intel)
        if: hashFiles('push/osx-x86_64/*') != ''
        run: butler push --if-changed --userversion "$USERVERSION" push/osx-x86_64 prismatic7/callsheet:osx-x86_64
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          USERVERSION: ${{ github.event.release.tag_name }}

      - name: Push Linux
        if: hashFiles('push/linux/*') != ''
        run: butler push --if-changed --userversion "$USERVERSION" push/linux prismatic7/callsheet:linux
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          USERVERSION: ${{ github.event.release.tag_name }}

      - name: Push Windows
        if: hashFiles('push/windows/*') != ''
        run: butler push --if-changed --userversion "$USERVERSION" push/windows prismatic7/callsheet:windows
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          USERVERSION: ${{ github.event.release.tag_name }}
